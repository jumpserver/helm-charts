name: Chart regression tests

on:
  pull_request:
    paths:
      - 'charts/jumpserver/**'
      - 'tests/**'
      - '.github/workflows/chart-tests.yaml'
  push:
    branches: ['main']
    paths:
      - 'charts/jumpserver/**'
      - 'tests/**'
      - '.github/workflows/chart-tests.yaml'

permissions:
  contents: read

jobs:
  graphical-sessions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v3
        with:
          version: v3.16.4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - run: python tests/test_graphical_sessions.py
